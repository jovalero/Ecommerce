name: Keep Render Backend Awake

on:
  schedule:
    # Ping every 10 minutes to prevent Render free-tier sleep
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive ping to Render
        run: |
          curl -s -f -m 25 https://holux-api.onrender.com/api/ping || echo "Keep-alive ping sent"
